name: Visa Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run visa monitor
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
          MONITOR_DIR: ${{ github.workspace }}
          STATE_FILE: monitor_state.json
          CERT_DIR: certificates
        run: python visa_monitor.py

      - name: Commit state file back (persist change detection)
        run: |
          git config user.name "visa-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add monitor_state.json
          if git diff --cached --quiet; then
            echo "No state change to commit"
          else
            git commit -m "Update monitor state [skip ci]"
            git push origin HEAD
          fi
